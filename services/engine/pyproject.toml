[project]
name = "grahrekha-engine"
version = "0.1.0"
description = "GrahRekha engine: palm analysis, astrology and rule evaluation"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi[standard]>=0.115",
  "jyotishganit>=0.1.3",
  "mediapipe>=0.10.20,<0.11",
  "numpy>=2.0",
  "onnxruntime>=1.20",
  "opencv-python-headless>=4.10",
  "pillow>=11.0",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "pyyaml>=6.0",
  "scikit-image>=0.24",
  "timezonefinder>=6.5",
]

[project.optional-dependencies]
# Optional AGPL providers live in adapters-agpl/ (D-011); never required by core.
agpl = []

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "httpx>=0.28",
  "ruff>=0.8",
  "mypy>=1.13",
  "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grahrekha_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["models: needs downloaded model files (scripts/fetch-data.sh --only M1,M2)"]
addopts = "--cov=grahrekha_engine --cov-report=term-missing --cov-fail-under=80"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]  # dummy secrets in tests

[tool.mypy]
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["mediapipe", "mediapipe.*", "cv2", "cv2.*", "onnxruntime", "onnxruntime.*", "jyotishganit", "jyotishganit.*", "skyfield", "skyfield.*", "timezonefinder", "timezonefinder.*"]
ignore_missing_imports = true

# scikit-image is only partially typed; allow calling its untyped functions from the
# modules that use it (everything else stays fully strict).
[[tool.mypy.overrides]]
module = [
  "grahrekha_engine.palm.segment.postprocess",
  "grahrekha_engine.palm.segment.classical",
  "grahrekha_engine.evaluation.line_metrics",
]
disallow_untyped_calls = false
