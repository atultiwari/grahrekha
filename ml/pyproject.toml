[project]
name = "grahrekha-ml"
version = "0.1.0"
description = "GrahRekha data preparation, evaluation and (later) training"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pillow>=11.0",
  "pyarrow>=18.0",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8", "mypy>=1.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grahrekha_ml"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101", "S311"]  # asserts in tests; seeded random is for sampling, not crypto

[tool.mypy]
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true
