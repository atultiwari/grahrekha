# Grouped, low-noise updates. Major upgrades of runtimes (Node LTS line, Python
# minor pinned by the engine) are deliberate decisions, not automatic PRs.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }

  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: uv
    directory: /services/engine
    schedule: { interval: weekly }
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories: [/services/engine, /apps/web]
    schedule: { interval: monthly }
    ignore:
      # Engine targets Python 3.12 (pyproject requires-python) and web targets Node 22 LTS.
      - dependency-name: python
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: node
        update-types: [version-update:semver-major]
