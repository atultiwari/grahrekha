[project]
name = "grahrekha-ml"
version = "0.1.0"
description = "GrahRekha data preparation, evaluation and (later) training"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "grahrekha-engine",
  "numpy>=2.0",
  "onnx>=1.23.1",
  "opencv-python-headless>=4.10",
  "pillow>=11.0",
  "pyarrow>=18.0",
  "scikit-image>=0.24",
  "segmentation-models-pytorch>=0.4",
  "torch>=2.5",
  "torchvision>=0.20",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8", "mypy>=1.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grahrekha_ml"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101", "S311"]  # asserts in tests; seeded random is for sampling, not crypto

[tool.mypy]
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

# Linux (CI) gets CPU-only PyTorch wheels instead of multi-GB CUDA builds;
# macOS keeps the default wheels (with MPS).
[tool.uv.sources]
grahrekha-engine = { path = "../services/engine", editable = true }
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.mypy.overrides]]
module = ["cv2", "cv2.*", "scipy", "scipy.*", "skimage", "skimage.*", "segmentation_models_pytorch", "segmentation_models_pytorch.*", "mediapipe", "mediapipe.*", "onnxruntime", "onnxruntime.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["grahrekha_ml.labels", "grahrekha_ml.roboflow_labels"]
disallow_untyped_calls = false
