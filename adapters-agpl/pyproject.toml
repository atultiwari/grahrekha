[project]
name = "grahrekha-adapters-agpl"
version = "0.1.0"
description = "Optional AGPL providers and validation for GrahRekha (see README; D-011)"
license = "AGPL-3.0-only"
requires-python = ">=3.12,<3.13"
dependencies = [
  "grahrekha-engine",
  "pyswisseph>=2.10",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grahrekha_adapters_agpl"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.uv.sources]
grahrekha-engine = { path = "../services/engine", editable = true }
