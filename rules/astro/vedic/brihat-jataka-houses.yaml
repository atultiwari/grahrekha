# Planets in houses, from Varahamihira's Brihat Jataka, Chapter XX ("On the Planets in the
# Bhavas"), tr. N. Chidambaram Iyer (Madras, 1885). Public domain (US: published 1885;
# archive.org b2488442x, Public Domain Mark). Rule text: CC BY 4.0 (LICENSE-CONTENT).
# Source text: scripts/fetch-data.sh --only B2 (OCR; quotes are lightly corrected and
# checked at >= 90% similarity).
#
# Selection (research/04-jyotish-sources.md, owner delegated the choice 2026-09-30):
# - Kept: statements about temperament, learning, work, standing and resources.
# - Left out: every statement about disease, blindness, bodily defects, sons/children
#   (fertility), danger to life or death (D-009), and moral verdicts ("wicked", "sinner",
#   "apostate", "unchaste"), which we will not tell a user about themselves.
#   This makes the selection lean positive; the owner should weigh that in review.
# - Houses are whole-sign houses from the lagna, as in the text; they need an exact
#   birth time (rules lint). BJ XX.10-11 scale every effect by the planet's sign dignity
#   (exaltation ... debilitation, combustion). That scaling is NOT modelled yet.

- id: astro.bj.sun_3rd_house
  tradition: vedic
  engine: astro
  domain: mind_learning
  when:
    and:
      - "==": [{var: time_confidence}, exact]
      - ">=": [{var: lagna_margin_deg}, 2]
      - "==": [{var: planets.Sun.house}, 3]
  statement:
    en: >-
      Your Sun sits in the 3rd house, which Varahamihira linked with a quick
      intelligence and the energy to act on it.
  polarity: positive
  strength: 2
  source:
    work: "Varahamihira, Brihat Jataka, tr. N. Chidambaram Iyer (1885)"
    locator: "Chapter XX, stanza 2"
    edition: "Madras, Foster Press; archive.org b2488442x"
    quote: >-
      the Sun occupy the 3rd house from the ascendant, the person will be intelligent
      and powerful
  mapping_note: &dignity Effects are scaled by the planet's sign dignity in BJ XX.10-11; not modelled yet.
  review: {status: extracted}

