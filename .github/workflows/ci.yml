name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# CI never needs secrets and never touches real datasets (docs/DECISIONS.md D-011).
jobs:
  guard:
    name: Repo guard (no images, data, weights, env files)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash scripts/tests/test-check-no-binaries.sh
      - run: bash scripts/check-no-binaries.sh

  engine:
    name: Engine (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/engine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - name: System libraries MediaPipe needs on Linux (OpenGL ES / EGL)
        working-directory: .
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libgles2 libegl1
      - run: uv sync --locked
      - name: Fetch MediaPipe model + example palm (pinned, checksum-verified)
        working-directory: .
        run: bash scripts/fetch-data.sh --only M1,M2,B1
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest

  ml:
    name: ML (data + training code)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - name: System libraries MediaPipe needs on Linux (OpenGL ES / EGL)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libgles2 libegl1
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -q

  agpl:
    name: AGPL adapters (astrology validation vs Swiss Ephemeris)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - name: Fetch the pinned DE421 ephemeris
        run: bash scripts/fetch-data.sh --only A1
      - name: Unit tests
        working-directory: adapters-agpl
        run: uv sync --locked && uv run pytest -q
      - name: Validation must stay within tolerance
        working-directory: adapters-agpl
        run: |
          uv run python -m grahrekha_adapters_agpl.validate_astro | tee report.md
          ! grep -q "| NO |" <(grep -v "true node" report.md)

  typescript:
    name: TypeScript packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: pnpm install --frozen-lockfile
      - name: Generated contracts are up to date
        run: |
          (cd services/engine && uv sync --locked)
          pnpm contracts:gen
          git diff --exit-code packages/contracts
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Mobile app bundles (Metro resolves workspace packages)
        run: pnpm --filter @grahrekha/mobile exec expo export --platform android --output-dir "$RUNNER_TEMP/mobile-export"
      - name: One-command DB setup works
        run: pnpm db:reset
      - name: schema.sql snapshot is up to date
        run: pnpm --filter @grahrekha/db snapshot && git diff --exit-code db/schema.sql

  docker:
    name: docker compose smoke test
    runs-on: ubuntu-latest
    needs: [engine, typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and start the stack
        run: docker compose up --build --detach --wait --wait-timeout 180
      - name: Web reaches engine through the API layer
        run: |
          for i in $(seq 1 30); do body=$(curl -fsS http://localhost:3000/api/health) && break; sleep 2; done
          echo "$body"
          test "$body" = '{"web":"ok","engine":{"status":"ok","version":"0.1.0"}}'
      - name: Engine protects /v1 routes (checked from inside the web container)
        run: |
          docker compose exec -T web node -e "fetch('http://engine:8000/v1/ping').then(r => process.exit(r.status === 401 ? 0 : 1))"
      - name: Astrology works inside the isolated engine (offline ephemeris, D-016)
        run: |
          docker compose exec -T web node -e "
            fetch('http://engine:8000/v1/astro/chart', {method: 'POST',
              headers: {'content-type': 'application/json', 'X-Engine-Secret': process.env.ENGINE_SHARED_SECRET},
              body: JSON.stringify({birth: {birth_date: '1996-07-04', birth_time: '09:10:00', time_confidence: 'exact', latitude: 18.404, longitude: 75.195}, reference_date: '2026-09-30'})})
            .then(r => r.json()).then(b => { console.log(b.lagna_sign, b.current_mahadasha); process.exit(b.lagna_sign === 'Leo' && b.current_mahadasha === 'Jupiter' ? 0 : 1); })"
      - name: Engine has no internet access (D-016)
        run: |
          if docker compose exec -T engine python -c "import urllib.request; urllib.request.urlopen('https://www.google.com', timeout=5)"; then
            echo "engine reached the internet"; exit 1
          fi
      - name: Engine is not published on the host
        run: test "$(curl -s -o /dev/null -w '%{http_code}' --max-time 3 http://localhost:8000/healthz || true)" = "000"
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v
