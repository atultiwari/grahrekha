# R&D data and model sources (committed; the data itself is git-ignored).
# Every item has: a landing page, direct download URL(s), size, login need, licence.
# Per-file SHA-256 checksums are appended by scripts/fetch-data.sh to data/fetch-log.tsv.
# Registry and owner decisions: docs/RESOURCES-REGISTRY.md. Policy: docs/DECISIONS.md D-014.
# Google Drive direct form: https://drive.usercontent.google.com/download?id=<ID>&export=download&confirm=t
# Kaggle direct form (no login): https://www.kaggle.com/api/v1/datasets/download/<owner>/<slug>
# Checked: 2026-09-29

