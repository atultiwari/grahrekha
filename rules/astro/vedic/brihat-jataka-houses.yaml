- id: astro.bj.saturn_1st_house_in_own_or_friendly_sign
  tradition: vedic
  engine: astro
  domain: career_work
  when:
    and:
      - "==": [{var: time_confidence}, exact]
      - ">=": [{var: lagna_margin_deg}, 2]
      - "==": [{var: planets.Saturn.house}, 1]
      - in: [{var: lagna_sign}, [Libra, Sagittarius, Capricorn, Aquarius, Pisces]]
  statement:
    en: >-
      Saturn rises in your 1st house in one of the signs where Varahamihira considered it
      strong. He described such a person as content, trusted with leadership over a
      community, and learned.
  polarity: positive
  strength: 2
  source:
    work: "Varahamihira, Brihat Jataka, tr. N. Chidambaram Iyer (1885)"
    locator: "Chapter XX, stanza 9"
    edition: "Madras, Foster Press; archive.org b2488442x"
    quote: >-
      But if the ascendant, occupied by Saturn, be Libra, Sagittari, Capricorn, Aquarius
      or Pisces, the person will be as happy as a king, will rule over a village or a
      town, will be learned
  mapping_note: >-
    "Rule over a village or a town" is rendered as community leadership. Saturn in the
    1st in other signs carries health statements in the same stanza and has no rule
    (D-009).
  review: {status: extracted}
