[project]
name = "grahrekha-engine"
version = "0.1.0"
description = "GrahRekha engine: palm analysis, astrology and rule evaluation"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi[standard]>=0.115",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
]

[project.optional-dependencies]
# Optional AGPL providers live in adapters-agpl/ (D-011); never required by core.
agpl = []

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "httpx>=0.28",
  "ruff>=0.8",
  "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grahrekha_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=grahrekha_engine --cov-report=term-missing --cov-fail-under=80"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]  # dummy secrets in tests

[tool.mypy]
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]
