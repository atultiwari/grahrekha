name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# CI never needs secrets and never touches real datasets (docs/DECISIONS.md D-011).
jobs:
  guard:
    name: Repo guard (no images, data, weights, env files)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: bash scripts/tests/test-check-no-binaries.sh
      - run: bash scripts/check-no-binaries.sh

  engine:
    name: Engine (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/engine
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest

  typescript:
    name: TypeScript packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
      - run: pnpm install --frozen-lockfile
      - name: Generated contracts are up to date
        run: |
          (cd services/engine && uv sync --locked)
          pnpm contracts:gen
          git diff --exit-code packages/contracts
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: One-command DB setup works
        run: pnpm db:reset
      - name: schema.sql snapshot is up to date
        run: pnpm --filter @grahrekha/db snapshot && git diff --exit-code db/schema.sql

  docker:
    name: docker compose smoke test
    runs-on: ubuntu-latest
    needs: [engine, typescript]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build and start the stack
        run: docker compose up --build --detach --wait --wait-timeout 180
      - name: Web reaches engine through the API layer
        run: |
          for i in $(seq 1 30); do body=$(curl -fsS http://localhost:3000/api/health) && break; sleep 2; done
          echo "$body"
          test "$body" = '{"web":"ok","engine":{"status":"ok","version":"0.1.0"}}'
      - name: Engine protects /v1 routes
        run: test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/v1/ping)" = "401"
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v
